name: Escrow-FairLance Client CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    name: Lint, Test, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Code Quality & Linting
        run: bun run lint

      - name: TypeScript Type Check
        run: bun run typecheck

      - name: Unit & Integration Test Suite
        run: bun run test

      - name: Production Next.js Build
        run: bun run build
